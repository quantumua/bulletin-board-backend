spring.application.name=bulletin-board-backend

spring.datasource.url=jdbc:h2:mem:bulletinboard
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

spring.mvc.problemdetails.enabled=true

# Sessions end only on log-out or browser close: no server-side idle timeout (FR3.2, ADR-001).
# The cookie has no Max-Age, is HttpOnly and SameSite=Lax; it is Secure when the request is HTTPS.
server.servlet.session.timeout=0
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Session ids travel only in the cookie, never in URLs (NFR2.2)
server.servlet.session.tracking-modes=cookie

# Comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=http://localhost:5173
